[project]
name = "oil-crisis-observatory"
version = "0.1.0"
description = "Zero-charge research tool: oil markets, EU fuel prices, Hormuz shipping, satellite review and headline evidence cards"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pyyaml==6.0.2",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "duckdb==1.1.3",
    "pyarrow==18.1.0",
    "openpyxl==3.1.5",
    "feedparser==6.0.11",
    "beautifulsoup4==4.12.3",
    "python-dotenv==1.0.1",
    "holidays==0.62",
    "matplotlib==3.9.3",
    "plotly==5.24.1",
    "streamlit==1.40.2",
    "click==8.1.7",
]

[project.optional-dependencies]
satellite = [
    "shapely==2.0.6",
    "pyproj==3.7.0",
    "rasterio==1.4.3",
    "scipy==1.14.1",
]
dev = ["pytest==8.3.4", "nbformat==5.10.4", "nbclient==0.10.1", "ipykernel==6.29.5"]

[project.scripts]
oco = "oco.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
